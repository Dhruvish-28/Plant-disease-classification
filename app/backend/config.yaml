Build a clean and professional web application for a machine learning project that predicts plant diseases from leaf images.

The backend model is already trained using PyTorch and a CNN architecture. The model takes an image of a plant leaf and outputs probabilities for 38 plant disease classes.

The web app should allow users to upload an image and view prediction results in a clear and professional interface.

Functional Requirements
1. Image Upload Input

The user must be able to upload an image of a plant leaf.

Requirements:

Drag-and-drop upload area

Also allow manual file selection

Accept formats:

.jpg

.jpeg

.png

Validate file type before submission

Display preview of uploaded image before prediction

2. Prediction Output

After submitting the image, the system should display:

Uploaded Image

Show the image the user uploaded.

Model Predictions

Display top 3 predicted diseases along with probabilities.

Example:

Prediction Results

1. Tomato Late Blight — 94.2%
2. Tomato Early Blight — 3.1%
3. Tomato Leaf Mold — 1.4%

Display predictions in a table or card layout.

3. Backend Integration

Use a Flask backend.

Expected API behavior:

POST /predict

Input:

multipart/form-data
image file

Processing steps:

Save uploaded image temporarily

Preprocess image (resize 224x224, convert to tensor)

Load trained CNN model

Run inference

Convert logits → probabilities using softmax

Extract top 3 predictions

Return predictions to frontend

Example JSON response:

{
  "predictions": [
    {"class": "Tomato Late Blight", "probability": 94.2},
    {"class": "Tomato Early Blight", "probability": 3.1},
    {"class": "Tomato Leaf Mold", "probability": 1.4}
  ]
}
